name: Publish

# Runs the full E2E suite and, only if it passes, publishes the multi-arch
# (linux/amd64, linux/arm64) image with the Go API and the web console to Docker Hub:
#
#   push to main       -> edercosta/aws-local-console:edge
#   push of tag v1.2.3 -> edercosta/aws-local-console:{1.2.3,1.2,latest}
#
# `latest` only moves on version tags, so it always points at a release.
#
# Repository secrets required:
#   DOCKERHUB_USERNAME  Docker Hub user (edercosta)
#   DOCKERHUB_TOKEN     Docker Hub access token with read/write scope (not the password)

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

# One run per ref. On main a newer push cancels the older run, so `edge` can never
# be overwritten by an older commit; version tags always run to completion.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

permissions:
  contents: read

env:
  IMAGE: edercosta/aws-local-console

jobs:
  e2e:
    name: E2E
    uses: ./.github/workflows/e2e.yml

  publish:
    name: Publish image
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No QEMU needed: the Dockerfile cross-builds on the runner's native platform.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata (tags and OCI labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # latest is set explicitly (tags only) instead of relying on flavor defaults.
          flavor: |
            latest=false
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=AWS Local Console
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published ${IMAGE}"
            echo
            while IFS= read -r tag; do printf -- '- %s\n' "$tag"; done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
