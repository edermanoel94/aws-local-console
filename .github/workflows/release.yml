name: Release

# Pushing a tag like v1.2.3 runs the full E2E suite and, only if it passes, publishes the
# multi-arch (linux/amd64, linux/arm64) image with the Go API and the web console to Docker Hub:
#   edercosta/aws-local-console:{1.2.3,1.2,latest}
#
# Repository secrets required:
#   DOCKERHUB_USERNAME  Docker Hub user (edercosta)
#   DOCKERHUB_TOKEN     Docker Hub access token with read/write scope (not the password)

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: edercosta/aws-local-console

jobs:
  e2e:
    name: E2E
    uses: ./.github/workflows/e2e.yml

  publish:
    name: Publish image
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No QEMU needed: the Dockerfile cross-builds on the runner's native platform.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata (tags and OCI labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=AWS Local Console
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
